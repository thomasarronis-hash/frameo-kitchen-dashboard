<svg xmlns="http://www.w3.org/2000/svg">
<!--
  web/public/icones.svg

  Rôle    : le sprite d'icônes de la page, servi à la racine (/icones.svg). Symboles repris tels quels de la
            maquette d.origine (i-home, i-sun, i-cloud, i-cal, i-fork, i-cart, i-shield,
            i-timer, i-moon, i-wifi ; i-photo retiré le 14/10 avec l'entrée Photos du menu), plus ceux qui manquaient, dessinés dans le même style : ciel
            (i-partly, i-fog, i-rain, i-snow, i-storm, i-wind), télé (i-tv), air et pollens (i-leaf), à faire
            (i-alert), et pour M3 : cocher (i-check), régler (i-plus, i-minus), fermer (i-close), étapes
            (i-prev, i-next), four (i-oven), sonnerie (i-bell) ; pour M5 (écran Maison, bandeau sonnette) :
            lecture/pause (i-play), retour (i-back), allumer (i-power), muet (i-mute), pile (i-battery), direct de la
            sonnette (i-camera) ; pour la page Aujourd'hui (14/10) : encart et page (i-today), rappels « À prévoir »
            (i-note), pluie (i-drop, aussi sur la ligne du ciel de l'Accueil), alertes d'encre (i-print) et
            d'ouverture (i-door) ; pour l'Agenda en grille (14/10) : lieu d'un rendez-vous dans sa fiche (i-pin) ; pour
            EDF Tempo (14/10) : éclair des pastilles et des alertes (i-eclair), lave-linge de la case de la veille d'un
            jour rouge ou blanc (i-machine) ; pour les draps (14/10) : lit (i-lit) ; pour les voitures (14/10) : voiture
            de face (i-voiture, menu, cartes et alerte), prise branchée (i-prise) et prise barrée (i-debranchee) ; pour
            l'entrée Enfants du menu (14/10) : étoile (i-etoile) ; pour le tableau des enfants (14/10, partie 3, cités par
            config/enfants.json et dessinés par la page d'après le flux) : levé (i-reveil), déjeuner (i-bol), dents
            (i-brosse), habillé (i-habits), cartable (i-cartable), calme avec son frère
            (i-coeur), chaussures (i-chaussure), « Ensuite : une histoire » (i-livre), cadeaux de la boutique (i-cadeau),
            motifs des points « A rangé » (i-caisse) et « A aidé » (i-main), « A mis la table » reprenant i-fork ; pour
            les écrans des enfants (14/10, partie 4) : petits personnages dessinés, avatars du barème (i-renard pour Timo,
            i-ourson pour Pablo), cadenas du mode parent (i-cadenas, et i-deverrouille dans son bandeau), attente d'un
            parent (i-sablier), onglet de la quête (i-carte), bourse des minutes (i-bourse), coffre fermé et ouvert
            (i-coffre, i-coffreouvert), bocal des étoiles de Pablo (i-bocal), pause du minuteur d'écran (i-pause) ; pour
            l'écran Clims (16/10) : clim murale du menu (i-clim), modes Froid (i-flocon) et Auto (i-auto), oscillations
            haut-bas (i-hautbas) et gauche-droite (i-cotes), ioniseur (i-ions), température de la pièce et hors-gel
            (i-thermo).
  Entrées : aucune.
  Sorties : des symbol en grille 24x24, nommés i-quelquechose, qu'une page affiche par un svg de classe ico contenant
            un use qui pointe vers /icones.svg#i-quelquechose (web/src/dom.js).
  Pièges  :
    - Aucun remplissage ni couleur ici : le trait vient de la classe .ico (stroke: currentColor, 1,8 px,
      bouts ronds), donc la couleur suit le texte et le thème.
    - Seuls les symboles utilisés par la page sont présents (tests/web-compat.test.js le vérifie, en comptant aussi
      ceux que cite config/enfants.json). Un nom d'icône est un seul mot après « i- » (le test les relève par le motif
      i-[a-z]+).
    - Pas de balise dans ce commentaire : un exemple de balise symbol écrit ici a déjà été pris pour du code en
      relisant le fichier.
-->
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
