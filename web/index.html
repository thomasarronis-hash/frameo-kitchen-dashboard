<!doctype html>
<!--
  web/index.html

  Rôle    : la page du cadre, scène fixe de 1920x1080 px CSS : menu, écrans (Accueil, Aujourd'hui, Météo, Repas,
            Courses, Maison, Photos, Agenda, Enfants, Voitures, Recette), vue de nuit, liseré d'un jour Tempo rouge, bandeau hors
            ligne, bandeau sonnette, et les couches des minuteurs (pastille, tiroir, alerte), du minuteur d'écran de Timo
            (pastille dans le menu, message de fin) et du « Cadre non appairé ». Servie sans clé (aucun secret) ; les données
            arrivent par /api/flux (cookie cadre_cle).
  Entrées : web/src/main.js (module ES) ; feuilles de web/styles ; polices et sprite de web/public, servis à
            la racine (/polices, /icones.svg) par le serveur comme par Vite.
  Sorties : la structure vide que les modules remplissent ; un rechargement si le module n'a pas démarré en
            60 s (idée de Wes ; 10 s au départ, trop court : sur le cadre, la centaine de modules met plus de
            10 s à se charger et la page se rechargeait en boucle, constat du 14/10).
  Pièges  :
    - viewport width=1920 : le kiosque l'applique tel quel (setUseWideViewPort) ; dans un navigateur de
      développement, web/src/scene.js met la scène à l'échelle par transform.
    - Modules ES natifs, sans bundler pour l'instant : chemins absolus (/src, /styles, /polices), ceux que
      Vite gardera ; le JS reste en ES2019 et le CSS suit les règles de compatibilité (conception §3.1).
    - Le petit script de démarrage est en ES5, hors module : il doit tourner même si le module ne se charge pas
      (réseau coupé au mauvais moment, module refusé par une vieille WebView). main.js pose window.cadreDemarre.
      Après 3 essais ratés de suite (compteur en sessionStorage, effacé au premier démarrage réussi), il
      n'insiste plus que toutes les 5 min : pas de rechargement en boucle serrée qui martèlerait le serveur.
      Sans sessionStorage (refusé), le compteur reste à 0 : un essai toutes les 60 s. Avant le rechargement
      différé de 5 min, on revérifie window.cadreDemarre : un module parti lentement mais finalement démarré
      n'est plus rechargé (défaut corrigé le 14/10).
    - Préchargement des polices avec crossorigin (obligatoire pour une police, même en même origine),
      sinon le navigateur les téléchargerait deux fois.
    - Icône vide (data:,) : sans elle, le navigateur demande /favicon.ico et récolte un 404 à chaque chargement.
    - tempo.css vient après les feuilles des écrans : sa case de la barre du bas repeint un .bouton-maison d'accueil.css
      (même spécificité, c'est l'ordre qui décide).
    - Ordre des couches (z-index dans les feuilles) : liseré Tempo (au-dessus des écrans et du menu, sous le reste),
      bandeau, « non appairé », pastilles (minuteurs de cuisine, minuteur d'écran), tiroir, bandeau sonnette (par-dessus
      tous les écrans, recette comprise), fin de la vidéo de Timo, alerte au-dessus de tout, nuit comprise.
-->

<script>
  (function () {
    var CLE = 'cadre.essais_demarrage';
    function lire() {
      try { return Number(sessionStorage.getItem(CLE)) || 0; } catch (e) { return 0; }
    }
    function ecrire(valeur) {
      try {
        if (valeur === 0) sessionStorage.removeItem(CLE);
        else sessionStorage.setItem(CLE, String(valeur));
      } catch (e) { return; }
    }
    setTimeout(function () {
      var essais = lire();
      if (window.cadreDemarre) {
        ecrire(0);
        return;
      }
      ecrire(essais + 1);
      setTimeout(function () {
        if (window.cadreDemarre) {
          ecrire(0);
          return;
        }
        location.reload();
      }, essais < 3 ? 0 : 300000);
    }, 60000);
  })();
</script>
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="scene" class="scene">

  <div id="non-appaire" class="non-appaire" role="alert" hidden></div>
  <div id="alerte" class="alerte" hidden></div>
</div>
</body>
</html>
